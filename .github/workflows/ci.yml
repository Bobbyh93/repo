name: CI

# Until now nothing in this repository ran on a pull request: pytest, the gate
# and the package validator only ever ran when someone ran them by hand, which
# meant the gate's verdict was a fact about a laptop rather than about the
# branch. This runs the same three things a contributor runs locally (see the
# "Run" section of README.md) on every PR and every push to master.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 is what the pipeline is developed and verified against. Other
          # versions are not claimed to work until someone runs them here.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # LibreOffice is absent on the runner, so export_lms.py records one MINOR
      # ("pdf export unavailable") per package and produces no deck PDF. That is
      # advisory and does not fail anything. Installing LibreOffice here would
      # cost several minutes per run for an artifact CI does not publish.
      - name: Tests
        run: pytest -q tests/
        # tests/test_committed_lessons.py re-gates every lesson in lessons/ and
        # validates the package that comes out, so a spec that stops gating
        # clean fails here rather than at the next hand rebuild.

      # The tests above import validate_and_gate.run() directly. This exercises
      # the documented command line instead -- argv parsing, the exit-code
      # contract (0 clean, 1 blockers, 2 unreadable) and the validator CLI.
      - name: Gate the demo spec through the CLI
        run: |
          python skills/harrity-lesson-builder-pipeline/scripts/validate_and_gate.py --demo --outdir out/demo
          python skills/harrity-lesson-builder-pipeline/scripts/validate_unified_package.py out/demo

      - name: Working tree is unchanged
        # Building a package must never write back into the repository. `out/`
        # is gitignored, so anything git reports here is the pipeline mutating
        # tracked files -- silently, since every command above exited 0.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
